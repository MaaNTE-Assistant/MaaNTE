# rev-b8f3c1-20260825
# nte auto farm - material route loop
name: farm
steps:
  - recognize: map_icon
    action: click

  - recognize: material_zone_marker
    action: click

  - recognize: teleport_button
    action: click

  - loop: until_stamina_empty
    steps:
      - recognize: enemy_cluster
        action: engage_combat_profile
        profile: esper_default
      - wait_for: combat_end
        timeout_ms: 300000
      - recognize: loot_popup
        action: click_claim

  - log: farm route complete
